# ==============================================================================
# Prometheus Scrape Configuration for Docker Auto-Discovery Exporter
# Add this block to your Prometheus server's prometheus.yml
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Docker Container Auto-Discovery Exporter
  - job_name: "docker"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "172.24.80.24:9209" # Replace with your target host IP or hostname
        labels:
          env: "PROD"
          ip: "172.24.80.24"
          hostname: "prd-gti-vm-grafana-gfnsvrcao-bed-01"

    # Example Metric Relabeling (Optional: keep or drop specific metrics if desired)
    # metric_relabel_configs:
    #   - source_labels: [__name__]
    #     regex: "(docker_container_.*|go_.*|process_.*)"
    #     action: keep
